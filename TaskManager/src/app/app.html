<app-navbar />
<router-outlet />
<ul class="grid grid-cols-1 gap-1 sm:grid-cols-2 lg:grid-cols-3 p-4">
  @for (item of tasks(); track item.Id) {
    <card-footer-example
      [taskId]="item.id"
      [title]="item.title"
      [description]="item.description"
      [CreatedAt]="item.createdAt"
      [IsCompleted]="item.isCompleted"
    />
  }
  @if (tasks().length == 0) {
    <h1
      class="bg-gradient-to-r from-pink-500 via-red-500 to-yellow-500 bg-clip-text text-5xl font-extrabold tracking-tight text-transparent sm:text-7xl"
    >
      No tasks Added please add task
    </h1>
  }
</ul>
